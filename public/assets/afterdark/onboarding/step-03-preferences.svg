<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Room preferences onboarding art</title><desc id="desc">Original AFTERDARK decorative illustration, burgundy, black and antique gold theme.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10050a"/><stop offset=".52" stop-color="#3a0a1b"/><stop offset="1" stop-color="#070405"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0c8"/><stop offset=".28" stop-color="#d5aa6d"/><stop offset=".7" stop-color="#8c5b2b"/><stop offset="1" stop-color="#f7d99a"/></linearGradient>
 <linearGradient id="ruby" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#ff7b83"/><stop offset=".35" stop-color="#9e1635"/><stop offset="1" stop-color="#310612"/></linearGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#d92a52" stop-opacity=".35"/><stop offset="1" stop-color="#d92a52" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="grain" width="88" height="88" patternUnits="userSpaceOnUse"><circle cx="8" cy="11" r="1" fill="#f6d7a0" opacity=".16"/><circle cx="53" cy="37" r=".8" fill="#fff" opacity=".08"/><circle cx="71" cy="77" r="1" fill="#f4b1ae" opacity=".12"/></pattern>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<ellipse cx="912.0" cy="216.0" rx="360.0" ry="306.0" fill="url(#glow)" filter="url(#soft)"/>
<rect width="1200" height="900" fill="url(#grain)" opacity=".55"/>
<rect x="24" y="24" width="1152" height="852" rx="34" fill="none" stroke="url(#gold)" stroke-opacity=".36" stroke-width="2"/>
<circle cx="600" cy="420" r="225" fill="#12070d" stroke="url(#gold)" stroke-width="12"/><circle cx="600" cy="420" r="175" fill="none" stroke="#84203a" stroke-width="5"/><path d="M 600 215 L 670 425 L 600 625 L 530 425Z" fill="url(#ruby)" stroke="url(#gold)" stroke-width="8"/><circle cx="600" cy="420" r="30" fill="url(#gold)"/><text x="600" y="750" text-anchor="middle" font-family="Georgia,serif" font-size="36" letter-spacing="7" fill="url(#gold)">ROOM PREFERENCES</text>
</svg>