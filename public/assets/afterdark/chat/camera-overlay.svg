<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Camera viewfinder overlay</title><desc id="desc">Original AFTERDARK decorative illustration, burgundy, black and antique gold theme.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080506"/><stop offset=".52" stop-color="#300913"/><stop offset="1" stop-color="#070405"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0c8"/><stop offset=".28" stop-color="#d5aa6d"/><stop offset=".7" stop-color="#8c5b2b"/><stop offset="1" stop-color="#f7d99a"/></linearGradient>
 <linearGradient id="ruby" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#ff7b83"/><stop offset=".35" stop-color="#9e1635"/><stop offset="1" stop-color="#310612"/></linearGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#d92a52" stop-opacity=".35"/><stop offset="1" stop-color="#d92a52" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="grain" width="88" height="88" patternUnits="userSpaceOnUse"><circle cx="8" cy="11" r="1" fill="#f6d7a0" opacity=".16"/><circle cx="53" cy="37" r=".8" fill="#fff" opacity=".08"/><circle cx="71" cy="77" r="1" fill="#f4b1ae" opacity=".12"/></pattern>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<ellipse cx="912.0" cy="192.0" rx="360.0" ry="272.0" fill="url(#glow)" filter="url(#soft)"/>
<rect width="1200" height="800" fill="url(#grain)" opacity=".55"/>
<rect x="24" y="24" width="1152" height="752" rx="34" fill="none" stroke="url(#gold)" stroke-opacity=".36" stroke-width="2"/>
<g fill="none" stroke="#f2d39b" stroke-width="9" opacity=".8"><path d="M 100 220 V 100 H 220 M 980 100 H 1100 V 220 M 100 680 V 800 H 220 M 980 800 H 1100 V 680"/><circle cx="600" cy="450" r="22" stroke="#f1b5b9"/><path d="M 600 385 V 515 M 535 450 H 665" stroke-width="3" opacity=".45"/></g><circle cx="1040" cy="155" r="20" fill="#e23a4e"/><text x="1080" y="165" font-family="Arial,sans-serif" font-size="24" fill="#f5e2c7">REC</text>
</svg>